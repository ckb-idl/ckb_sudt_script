[workspace]

[package]
name = "authorization-choice-lock"
version = "0.1.0"
edition = "2024"

[dependencies]
ckb-std = "1.1"
ckb-hash = { version = "0.202", default-features = false, features = ["ckb-contract"] }
ckb-idl-derive = { path = "../../../ckb-idl-derive" }
ckb-idl-types = { path = "../../../ckb-idl-derive/ckb-idl-types", features = ["ckb-contract"] }

[features]
library = []
native-simulator = ["library", "ckb-std/native-simulator"]

[dev-dependencies]
ckb-idl-export = { path = "../../../ckb-idl-derive/ckb-idl-export" }
