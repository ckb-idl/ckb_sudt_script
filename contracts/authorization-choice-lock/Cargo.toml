[workspace]

[package]
name = "authorization-choice-lock"
version = "0.1.0"
edition = "2024"

[dependencies]
ckb-std = "1.1"
ckb-hash = { version = "0.202", default-features = false, features = ["ckb-contract"] }
ckb-idl-derive = { git = "https://github.com/ckb-idl/ckb-idl-derive", branch = "dev" }
ckb-idl-types = { git = "https://github.com/ckb-idl/ckb-idl-derive", branch = "dev", features = ["ckb-contract"] }

[features]
library = []
native-simulator = ["library", "ckb-std/native-simulator"]

[dev-dependencies]
ckb-idl-export = {
  git = "https://github.com/OWK50GA/ckb-idl-derive",
  branch = "dev",
  package = "ckb-idl-export"
}
